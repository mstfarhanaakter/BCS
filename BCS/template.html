<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCS English Interactive Exam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9d4edd;
            --secondary-color: #7a2fc0;
            --correct-color: #198754;
            --incorrect-color: #dc3545;
            --bg-light: #f5f5f7;
        }

        body {
            background: var(--bg-light);
            font-family: 'Noto Sans', sans-serif;
            color: #333;
        }

        .card.section-card {
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-bottom: 20px;
            
        }

        .card-header.section-header {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            transition: background 0.3s;
        }

        .card-header.section-header:hover {
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
        }

        .btn-check-answer {
            font-weight: bold;
            color: #000;
            background-color: #ffe066;
            border: none;
            transition: background 0.3s;
        }

        .btn-check-answer:hover {
            background-color: #ffe57d;
        }

        .card-header.question-header {
            font-weight: 600;
            cursor: pointer;
            background-color: #e0f8b7;
            color: black;
            border-radius: 10px;
            margin-bottom: 5px;
            padding: 12px 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: background 0.2s;
        }

        .card-header.question-header:hover {
            background-color: #fcfeff;
            font-weight: bold;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: #d5bcff;
        }

        .option-label input[type="radio"] {
            display: none;
        }

        .option-label span.letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #ddd;
            color: #000;
            font-weight: bold;
            margin-right: 12px;
        }

        .option-label input:checked+.letter {
            background-color: var(--primary-color);
            color: #fff;
        }

        .correct {
            border-left: 4px solid var(--correct-color);
            background-color: #d4edda;
        }

        .incorrect {
            border-left: 4px solid var(--incorrect-color);
            background-color: #f8d7da;
        }

        .answer-explanation {
            padding: 10px 12px;
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            border-radius: 6px;
            margin-top: 6px;
        }

        .section-summary {
            display: none;
            background-color: #fff3cd;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .section-summary .correct {
            color: #198754;
            font-weight: bold;
        }

        .section-summary .wrong {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <h1 class="mb-4 text-center">BCS Template Exam</h1>
        <div id="sectionsContainer" class="accordion"></div>
   <script src="english.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   
</body>

</html>
